# ============================================================
# lab-tools.conf — Lab Tools Nginx 反向代理配置
#
# 将 https://lab.sergget.qzz.io 的 HTTPS 流量代理到后端 127.0.0.1:8000
# （后端内部端口由 deploy/lab-tools.service 的 LAB_TOOLS_PORT 决定）
#
# 按需修改：
#   - server_name：替换为实际域名（当前为占位域名）
#   - SSL 证书位于 /etc/nginx/snippets/ssl-sergget.conf（独立维护，
#     证书申请/续期不涉及本文件，请单独管理）
#   - client_max_body_size：与 LAB_TOOLS_MAX_UPLOAD_MB 对应，可按需调整
#
# 应用无登录鉴权，仅通过 ZeroTrust（HTTPS + 访问控制）暴露，勿直接暴露后端端口。
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name lab.sergget.qzz.io;

    # SSL 证书与参数（独立维护，见 /etc/nginx/snippets/ssl-sergget.conf）
    include /etc/nginx/snippets/ssl-sergget.conf;

    # 上传/产物最大 200MB（对应 LAB_TOOLS_MAX_UPLOAD_MB=100 + 转换产物余量）
    client_max_body_size 200m;

    # 后端单进程托管 API 与前端静态产物（含 /api 路径），全量代理
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;   # OCR/转换任务可能耗时较长
        proxy_send_timeout 300s;
    }
}
